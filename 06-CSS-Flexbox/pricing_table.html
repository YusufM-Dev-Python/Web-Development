<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Flexbox Pricing Table</title>
  <link href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Sono', sans-serif; 
      margin: 0;
      background-color: #e9ecef; /* Neutral background so the white cards stand out */
      min-height: 100vh;         /* Ensures the background covers the whole screen */
      display: flex;             /* Centering the entire container */
      justify-content: center;
      align-items: center;
    }

    .pricing-container {
      display: flex;             /* The flex engine that aligns our cards */
      justify-content: center;   /* Spacing cards evenly on the main axis */
      align-items: center;       /* Keeping them aligned vertically */
      gap: 2rem;                 /* Adds space between the cards */
      flex-wrap: wrap;           /* Allows cards to wrap to a new line on smaller screens */
      padding: 20px;
    }

    .pricing-plan {
      flex: 1;                   /* Cards grow to share space equally */
      max-width: 350px;          /* Prevents cards from getting too wide on large screens */
      padding: 30px;
      background-color: white;   /* Card background */
      border-radius: 15px;       /* Rounded corners for a modern look */
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1); /* Subtle shadow for depth */
    }

    .plan-title { font-size: 22px; color: #555; margin-bottom: 10px; }
    .plan-price { font-size: 40px; font-weight: bold; margin-bottom: 20px; }

    .plan-features { list-style: none; padding: 0; margin-bottom: 25px; }
    .plan-features li { margin-bottom: 15px; font-size: 14px; }

    .plan-button {
      padding: 12px 30px; 
      background-color: #ff6600;
      color: white;
      border-radius: 25px;
      border: none;
      cursor: pointer;          /* Shows the pointer cursor on hover */
      font-weight: bold;
    }

    /* Hover state: simple color change */
    .plan-button:hover { 
      background-color: #e65c00; 
    }

    /* Responsive Design: When screen is small, stack cards in a column */
    @media (max-width: 1250px) {
      .pricing-container { flex-direction: column; }
    }
  </style>
</head>

<body>
  <div class="pricing-container">
    
    <!-- Each plan is its own div -->
    <div class="pricing-plan">
      <div class="plan-title">Basic</div>
      <div class="plan-price">$9.99</div>
      <ul class="plan-features">
        <li>✅ 10GB Storage</li>
        <li>✅ 1 User</li>
        <li>🚫 No Support</li>
      </ul>
      <button class="plan-button">Get Started</button>
    </div>

    <div class="pricing-plan">
      <div class="plan-title">Standard</div>
      <div class="plan-price">$19.99</div>
      <ul class="plan-features">
        <li>✅ 50GB Storage</li>
        <li>✅ 5 Users</li>
        <li>✅ Phone Support</li>
      </ul>
      <button class="plan-button">Get Started</button>
    </div>

    <div class="pricing-plan">
      <div class="plan-title">Premium</div>
      <div class="plan-price">$49.99</div>
      <ul class="plan-features">
        <li>✅ 100GB Storage</li>
        <li>✅ 10 Users</li>
        <li>✅ 24/7 Support</li>
      </ul>
      <button class="plan-button">Get Started</button>
    </div>

  </div>
</body>
</html>
