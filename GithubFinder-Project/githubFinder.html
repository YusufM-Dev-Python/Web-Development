<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Profile Finder</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Github Finder</h1>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Enter Github Username">
            <button id="searchBtn">Search</button>
        </div>

        <div id="cardContainer">
            <script>
                const searchInput = document.querySelector("#searchInput")
                const buttonClick = document.querySelector("#searchBtn")
                buttonClick.addEventListener('click',function (e) {
                    if (searchInput.value == ""){
                        console.log("Please enter a username !")
                    }
                    else{
                        const username = searchInput.value
                        const url = `https://api.github.com/users/${username}`
                        console.log(url)

                        const xhr = new XMLHttpRequest()
                        xhr.open('GET', url);
                        xhr.onreadystatechange = function(){
                            if(xhr.readyState == 4 && xhr.status == 200){
                                const data = JSON.parse(this.responseText)
                                const myPhoto = document.querySelector("#cardContainer")
                                myPhoto.innerHTML = `
                                    <img src="${data.avatar_url}" alt="Github profle picture">
                                    <h2>${data.name || data.login}</h2>
                                    <p>${data.bio || "no bio availaible"}</p>
                                    <p>Followers = ${data.followers} | Repos:${data.public_repos}</p>
                                    <a href="${data.html_url}" target="_blank">Visit GitHub Profile</a>`;
                            }
                        };
                    xhr.send();
                    }
                })
            </script>
        </div>
    </div>
    
</body>
</html>
